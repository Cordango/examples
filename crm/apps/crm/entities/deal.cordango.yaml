entity: deal
label: Deal
description: A named opportunity with a company, a value and a stage. The thing the pipeline board is a picture of.
icon: mdi-handshake-outline
plural: Deals
display: name
fields:
  name:
    label: Deal
    type: text
    required: true
    group: Deal
  organization:
    label: Company
    type: reference
    group: Deal
    targetEntity: organization
    targetApp: core_organizations
  primary_contact:
    label: Primary contact
    type: reference
    help: The person at the company this is being sold to. External people only — a colleague comes from the platform directory.
    group: Deal
    targetEntity: contact
    targetApp: core_organizations
  lead:
    label: Converted from
    type: reference
    help: The lead this deal came out of, so the original enquiry stays attached to the money.
    group: Deal
    targetEntity: lead
  amount:
    label: Value
    type: money
    group: Commercial
    currency: EUR
  probability:
    label: Probability
    type: integer
    group: Commercial
    unit: '%'
  expected_close:
    label: Expected close
    type: date
    group: Commercial
    role: due
  closed_on:
    label: Closed on
    type: date
    group: Commercial
  stage:
    label: Stage
    type: select
    group: Commercial
    role: status
  assigned_to:
    label: Assigned to
    type: reference
    group: Ownership
    targetEntity: person
    targetApp: platform
  source:
    label: Source
    type: select
    group: Ownership
    options:
      - value: web_form
        label: Web form
      - value: referral
        label: Referral
      - value: event
        label: Event
      - value: outbound
        label: Outbound
      - value: partner
        label: Partner
      - value: other
        label: Other
  lost_reason:
    label: Why we lost
    type: select
    group: Outcome
    options:
      - value: price
        label: Price
      - value: missing_feature
        label: Missing feature
      - value: went_quiet
        label: Went quiet
      - value: chose_competitor
        label: Chose a competitor
      - value: no_budget
        label: No budget
      - value: bad_timing
        label: Bad timing
  next_step:
    label: Next step
    type: text
    help: The one thing that has to happen for this to move. Empty on an open deal is the signal to look at it.
    group: Follow-up
  next_follow_up:
    label: Follow up on
    type: date
    group: Follow-up
  won_reason:
    label: Why we won
    type: select
    group: Outcome
    options:
      - value: price
        label: Price
      - value: product_fit
        label: Product fit
      - value: relationship
        label: Relationship
      - value: timing
        label: Timing
      - value: incumbent_failed
        label: Incumbent failed
  won_notes:
    label: What made the difference
    type: longtext
    group: Outcome
  lost_notes:
    label: What we would do differently
    type: longtext
    group: Outcome
  notes:
    label: Notes
    type: longtext
    group: Notes
