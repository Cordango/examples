role: admin
name: Administrator
description: Full control of the CRM, including publishing a form to the public internet and deleting submissions.
grants:
  lead:
    create: true
    read: true
    update: true
    delete: true
    commands:
      - start_working
      - qualify_lead
      - convert_lead
      - disqualify_lead
      - reopen_lead
