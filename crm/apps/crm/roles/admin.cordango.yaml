    read: true
    update: true
    delete: true
  campaign:
    create: true
    read: true
    update: true
    delete: true
  intake_form:
    create: true
    read: true
    update: true
    delete: true
  intake_question:
    create: true
    read: true
    update: true
    delete: true
  intake_submission:
    create: true
    read: true
    update: true
    delete: true
  intake_answer:
    create: true
