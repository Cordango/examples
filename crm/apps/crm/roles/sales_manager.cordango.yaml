role: sales_manager
name: Sales manager
description: Everything a rep can do, plus reopening closed deals and correcting the campaign list.
grants:
  lead:
    create: true
    read: true
    update: true
    delete: true
    commands:
      - start_working
      - qualify_lead
      - convert_lead
      - disqualify_lead
      - reopen_lead
  deal:
    create: true
    read: true
    update: true
    delete: true
    commands:
      - send_proposal
      - start_negotiation
      - mark_won
      - mark_lost
      - reopen_deal
  activity:
    create: true
    read: true
    update: true
    delete: true
  campaign:
    create: true
    read: true
    update: true
  intake_form:
    read: true
  intake_question:
    read: true
  intake_submission:
    create: true
    read: true
  intake_answer:
    create: true
    read: true
