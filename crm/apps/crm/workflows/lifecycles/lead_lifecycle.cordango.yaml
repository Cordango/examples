lifecycle: lead_lifecycle
entity: lead
stateField: status
initial: new
states:
  new:
    label: New
    phase: not_started
  working:
    label: Working
    phase: active
  qualified:
    label: Qualified
    phase: active
  converted:
    label: Converted
    phase: done
  unqualified:
    label: Unqualified
    phase: cancelled
transitions:
  start_working:
    label: Start working
    from:
      - new
    to: working
    action:
      style: primary
      placements:
        - recordHeader
        - tableRow
      effects: []
  qualify_lead:
    label: Qualify
    from:
      - new
      - working
    to: qualified
    requiredFields:
      - email
      - assigned_to
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Lead qualified. Convert it when there is something to sell.
      input:
        fields:
          - rating
          - budget
        required:
          - rating
      effects:
        - type: updateRecord
          set:
            qualified_on: '{{today}}'
  convert_lead:
    label: Convert to deal
    from:
      - new
      - working
      - qualified
    to: converted
    action:
      icon: mdi-trending-up
      style: primary
      placements:
        - recordHeader
      successMessage: Deal created from this lead.
      confirm:
        title: Convert this lead into a deal?
        message: Link the company this is being sold to — pick it, or add it from the same box if it is not on file yet. Leave it empty and the deal is still created; the company can be set on the deal later.
        confirmLabel: Convert
      input:
        fields:
          - organization
          - budget
      effects:
        - type: createRecord
          set:
            name: '{{record.full_name}}'
            organization: '{{record.organization}}'
            lead: '{{record.id}}'
            assigned_to: '{{record.assigned_to}}'
            amount: '{{record.budget}}'
            source: '{{record.source}}'
          entity: deal
  disqualify_lead:
    label: Not qualified
    from:
      - new
      - working
      - qualified
    to: unqualified
    requiredFields:
      - unqualified_reason
    action:
      style: danger
      placements:
        - recordHeader
      confirm:
        title: Mark this lead as not qualified?
        message: It stays in the list and can be reopened.
        confirmLabel: Disqualify
        tone: danger
      input:
        fields:
          - unqualified_reason
        required:
          - unqualified_reason
      effects: []
  reopen_lead:
    label: Reopen
    from:
      - unqualified
    to: working
    action:
      placements:
        - recordHeader
      effects: []
