screen: leads
label: Leads
layout:
  - kind: stack
    gap: md
    blocks:
      - kind: row
        gap: md
        blocks:
          - kind: stat
            label: New
            icon: mdi-inbox-arrow-down-outline
            source:
              entity: lead
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: new
          - kind: stat
            label: Working
            icon: mdi-phone-outline
            source:
              entity: lead
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: working
          - kind: stat
            label: Qualified
            icon: mdi-check-decagram-outline
            source:
              entity: lead
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: qualified
          - kind: stat
            label: Converted
            icon: mdi-trending-up
            source:
              entity: lead
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: converted
      - kind: tabs
        tabs:
          - label: Inbox
            blocks:
              - kind: split
                label: Leads to work
                emptyText: No leads waiting — nice work.
                source:
                  entity: lead
                  sort:
                    - field: full_name
                      direction: asc
                  filters:
                    - field: status
                      operator: neq
                      value: converted
                    - field: status
                      operator: neq
                      value: unqualified
                fields:
                  - company_name
                  - budget
                  - assigned_to
                  - qualified_on
                  - status
                  - source
                blocks:
                  - kind: text
                    value: '{full_name}'
                    size: lg
                    weight: bold
                  - kind: row
                    gap: sm
                    blocks:
                      - kind: chip
                        field: status
                      - kind: chip
                        field: rating
                  - kind: columns
                    columns:
                      - - kind: field
                          field: company_name
                          label: Company
                        - kind: field
                          field: job_title
                          label: Job title
                        - kind: field
                          field: email
                          label: Email
                        - kind: field
                          field: phone
                          label: Phone
                      - - kind: field
                          field: budget
                          label: Indicated budget
                          format: money
                        - kind: field
                          field: source
                          label: Source
                        - kind: field
                          field: campaign
                          label: Campaign
                        - kind: field
                          field: assigned_to
                          label: Assigned to
                  - kind: field
                    field: notes
                    label: Notes
                  - kind: row
                    gap: sm
                    blocks:
                      - kind: action
                        command: start_working
                        visibleWhen:
                          value: '{{item.status}}'
                          eq: new
                      - kind: action
                        command: qualify_lead
                        visibleWhen:
                          value: '{{item.status}}'
                          in:
                            - new
                            - working
                      - kind: action
                        command: convert_lead
                        style: primary
                        visibleWhen:
                          value: '{{item.status}}'
                          in:
                            - new
                            - working
                            - qualified
                      - kind: action
                        command: disqualify_lead
                        style: danger
                        visibleWhen:
                          value: '{{item.status}}'
                          in:
                            - new
                            - working
                            - qualified
                      - kind: action
                        command: reopen_lead
                        visibleWhen:
                          value: '{{item.status}}'
                          eq: unqualified
          - label: All leads
            blocks:
              - kind: view
                view: leads__unworked
subject: lead
