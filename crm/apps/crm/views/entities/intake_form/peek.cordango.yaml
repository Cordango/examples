peek: intake_form
blocks:
  - kind: hub
    title: name
    subtitle:
      - creates
    facts:
      - active
      - publish
      - route_assigned_to
    actions:
      - edit
  - kind: section
    label: What it files
    blocks:
      - kind: fields
        fields:
          - route_source
          - route_campaign
          - route_rating
        hideEmpty: true
        emptyText: Every lead from this form starts with nothing pre-filled.
  - kind: child
    label: What it asks
    entity: intake_question
    via: form
    childType: table
    inlineCreate: false
    limit: 6
