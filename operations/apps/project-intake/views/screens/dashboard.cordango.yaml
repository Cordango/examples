screen: dashboard
label: Dashboard
subtitle: Proposals waiting for the committee and the projects already running.
layout:
  - kind: tiles
    tiles:
      - label: Waiting
        icon: gavel
        color: warning
        caption: With the committee
        source:
          entity: project
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: in_review
      - label: Active
        icon: rocket-launch-outline
        color: success
        caption: Projects running now
        source:
          entity: project
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: active
      - label: Committed
        icon: cash-multiple
        color: primary
        caption: Estimated cost, approved and running
        source:
          entity: project
          aggregate:
            op: sum
            field: estimated_cost
          filters:
            - field: status
              operator: in
              value:
                - approved
                - planned
                - active
  - kind: view
    view: projects__queue
subject: project
