automation: end_approaching
name: Two weeks before a project is meant to end
when:
  all:
    - field: status
      operator: eq
      value: active
    - field: target_end
      operator: eq
      value: '{{today+14}}'
effects:
  - type: notify
    to: '{{record.project_manager}}'
    title: '{{record.title}} is due to end in two weeks'
    message: '{{record.progress_pct}}% of its milestones are done.'
    link: auto
trigger: schedule
entity: project
cron: 0 8 * * *
