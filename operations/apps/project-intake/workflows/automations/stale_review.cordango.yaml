automation: stale_review
name: Monday nudge on proposals the committee has not decided
when:
  field: status
  operator: eq
  value: in_review
effects:
  - type: notify
    to: '{{record.sponsor}}'
    title: 'Still undecided: {{record.title}}'
    message: Priority score {{record.priority_score}}, {{record.committee_score}} from the committee so far.
    link: auto
trigger: schedule
entity: project
cron: 0 8 * * 1
