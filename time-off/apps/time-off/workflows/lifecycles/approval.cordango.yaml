lifecycle: approval
entity: time_off
stateField: status
initial: pending
states:
  pending:
    label: Pending
    color: '#f59e0b'
  approved:
    label: Approved
    color: '#16a34a'
    terminal: true
  declined:
    label: Declined
    color: '#dc2626'
    terminal: true
transitions:
  approve:
    label: Approve
    from:
      - pending
    to: approved
    action:
      key: approve_time_off
      style: primary
      placements:
        - recordHeader
      successMessage: Time off approved.
      effects:
        - type: notify
          to: '{{record.requested_by}}'
          title: Time off approved
          message: Your time-off request was approved.
          link: auto
  decline:
    label: Decline
    from:
      - pending
    to: declined
    action:
      key: decline_time_off
      style: danger
      placements:
        - recordHeader
      successMessage: Time off declined.
      confirm:
        title: Decline this request?
        confirmLabel: Decline
        tone: danger
      input:
        fields:
          - decline_reason
        required:
          - decline_reason
      effects:
        - type: notify
          to: '{{record.requested_by}}'
          title: Time off declined
          message: Your time-off request was declined.
          link: auto
