screen: connected
label: Connected
icon: handshake
layout:
  - kind: stack
    gap: lg
    blocks:
      - kind: stack
        gap: sm
        class: bg-blue-darken-3 text-white pa-6 rounded-xl
        blocks:
          - kind: text
            value: One workspace, not one app
            size: xl
            weight: bold
          - kind: text
            size: sm
            value: The companies below are records in the platform's Organizations app. This app does not keep a second copy of a company - it points at the one the whole workspace shares, so renaming it there renames it here.
      - kind: section
        label: References that leave this app
        icon: handshake
        blocks:
          - kind: text
            value: '`targetApp` on a reference field. The runtime resolves it through the workspace, which is why the chip is clickable and the name stays right. The contact picker is narrowed by `optionsFilter` to the contacts of the company already chosen.'
            size: sm
            color: medium-emphasis
          - kind: table
            class: mt-2
            openDetail: true
            newButton: true
            inlineEdit: true
            allowDelete: true
            filterBar:
              search:
                - headline
              facets:
                - capability
            fields:
              - key: headline
                width: 220
              - organization
              - contact
              - capability
              - since
              - seats
              - hotline
            source:
              entity: adopter
              sort:
                - field: since
                  direction: desc
      - kind: section
        label: A directory of them
        icon: view-grid
        blocks:
          - kind: text
            value: '`imageField` is the peer of `displayField`: one says what a record is called, the other what it looks like. Wherever the record appears, so does its logo.'
            size: sm
            color: medium-emphasis
          - kind: repeat
            as: ad
            wrap: true
            cols: 3
            gap: md
            class: mt-2
            openDetail: true
            emptyText: No adopters yet - add a company in Organizations first.
            source:
              entity: adopter
            blocks:
              - kind: card
                padding: lg
                bordered: true
                class: rounded-lg
                blocks:
                  - kind: field
                    field: headline
                    weight: bold
                    size: lg
                  - kind: field
                    field: organization
                    size: sm
                    class: mt-1
                  - kind: row
                    gap: sm
                    align: center
                    class: mt-3
                    blocks:
                      - kind: stat
                        label: Seats
                        field: seats
                      - kind: chip
                        field: capability
      - kind: section
        label: What cannot be shown from one app
        icon: alert-circle
        blocks:
          - kind: stack
            padding: lg
            class: bg-amber-lighten-5 rounded-lg
            blocks:
              - kind: text
                value: A cross-app aggregate column
                weight: bold
              - kind: text
                value: 'A table column can be a figure READ FROM another app - `column.source` with its own app, entity and aggregate. It needs the OTHER app to hold a reference pointing back at these rows, and nothing in this workspace references a capability. So it is named here and not drawn: a faked one would be a column of zeroes claiming to be a measurement.'
                size: sm
                color: medium-emphasis
                class: mt-1
      - kind: section
        label: The core apps this one leans on
        icon: apps
        blocks:
          - kind: text
            value: Declared in `uses`, which is what lets an update to one of those apps be checked against what this one actually relies on.
            size: sm
            color: medium-emphasis
          - kind: grid
            cols: 2
            gap: md
            class: mt-2
            blocks:
              - kind: stack
                padding: lg
                class: bg-surface border rounded-lg
                blocks:
                  - kind: text
                    value: core_organizations
                    weight: bold
                    icon: office-building
                  - kind: text
                    value: organization, contact - the companies using a capability are the workspace's own companies.
                    size: sm
                    color: medium-emphasis
              - kind: stack
                padding: lg
                class: bg-surface border rounded-lg
                blocks:
                  - kind: text
                    value: core_documents
                    weight: bold
                    icon: book-open
                  - kind: text
                    value: space - a capability's written pages live in the platform's document store, not in a longtext field here.
                    size: sm
                    color: medium-emphasis
subject: adopter
