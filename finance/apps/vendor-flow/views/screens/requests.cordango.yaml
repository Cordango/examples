screen: requests
label: Requests
layout:
  - kind: tiles
    tiles:
      - label: Needs security
        icon: shield-lock-outline
        color: warning
        caption: Waiting for a security review
        source:
          entity: vendor_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: security_review
      - label: Needs finance
        icon: bank-outline
        color: info
        caption: Waiting for a finance review
        source:
          entity: vendor_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: finance_review
  - kind: board
    label: Request pipeline
    source:
      entity: vendor_request
      sort:
        - field: submitted_at
          direction: desc
    groupField: status
    cardFields:
      - vendor
      - requester
      - annual_cost
      - renewal_on
    newButton: true
subject: vendor_request
