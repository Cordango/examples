screen: subscriptions
label: Subscriptions
layout:
  - kind: tiles
    tiles:
      - label: Annual spend
        icon: cash-multiple
        color: primary
        caption: Active contracts
        source:
          entity: subscription
          aggregate:
            op: sum
            field: annual_cost
          filters:
            - field: status
              operator: eq
              value: active
      - label: Deciding
        icon: calendar-alert
        color: warning
        caption: Cancellation deadline within 90 days
        source:
          entity: subscription
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: active
            - field: cancellation_deadline
              operator: lte
              value: '{{today+90}}'
  - kind: view
    view: subscriptions__renewing
  - kind: view
    view: subscriptions__spare_seats
subject: subscription
