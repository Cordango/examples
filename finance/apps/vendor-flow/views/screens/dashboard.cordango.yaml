screen: dashboard
label: Overview
subtitle: Vendor requests in review and what approved vendors cost a year.
layout:
  - kind: tiles
    tiles:
      - label: In review
        icon: shield-search
        color: warning
        caption: Security or finance review
        source:
          entity: vendor_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: in
              value:
                - submitted
                - security_review
                - finance_review
      - label: Approved
        icon: check-decagram-outline
        color: success
        caption: Vendors cleared to use
        source:
          entity: vendor_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: approved
      - label: Annual spend
        icon: cash-multiple
        color: primary
        caption: Approved vendors, per year
        source:
          entity: vendor_request
          aggregate:
            op: sum
            field: annual_cost
          filters:
            - field: status
              operator: eq
              value: approved
  - kind: card
    label: Requests by status
    blocks:
      - kind: chart
        chartType: donut
        source:
          entity: vendor_request
          aggregate:
            op: count
            groupBy: status
subject: vendor_request
