screen: renewals
label: Renewals
layout:
  - kind: tiles
    tiles:
      - label: Renewals due
        icon: calendar-refresh
        color: warning
        caption: In the next 30 days
        source:
          entity: vendor_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: approved
            - field: renewal_on
              operator: between
              value:
                - '{{today}}'
                - '{{today+30}}'
  - kind: view
    view: requests__renewals
subject: vendor_request
