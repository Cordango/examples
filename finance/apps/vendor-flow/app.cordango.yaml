app: vendor_flow
name: Vendor & SaaS Management
version: 0.3.0
description: Vendor intake through forms the vendor team designs, a security and finance review, and the register of what you are actually paying for afterwards — cost, seats, renewal dates and the notice you have to give to stop it.
schemaVersion: '2.0'
purpose:
  summary: 'Owns third-party vendors — the review that lets one in, and the live contracts that follow: owner, cost, seats, renewal date, notice period and DPA.'
  duties:
    - owns vendor requests and their security, privacy and operational checks
    - lets anybody in the company ask for a tool through a form the vendor team designs, without joining the app
    - owns the register of live subscriptions and what each one costs
    - tracks who actually holds a seat, so a renewal can be argued with numbers
    - warns the owner before the cancellation deadline, once rather than daily
    - keeps DPA status per contract and chases the ones outstanding
    - announces requested, approved, renewed, notice given and cancelled
uses:
  - app: core_organizations
    entities:
      - organization
    why: a vendor is the canonical company record, not a name typed twice
  - app: purchase_requests
    entities:
      - purchase_request
    why: software bought through a purchase request becomes a contract here
presentation:
  icon: mdi-shield-check-outline
  color: '#475569'
  category: Finance
  tagline: Approve SaaS without losing the paper trail, then remember to cancel it.
order:
  entities:
    - vendor_request
    - review_check
    - subscription
    - seat_assignment
    - renewal_review
    - vendor_intake_form
    - vendor_intake_question
    - vendor_intake_submission
    - vendor_intake_answer
  pages:
    - request_vendor
    - dashboard
    - requests
    - subscriptions
    - renewals
    - renewal_calendar
    - intake_forms
  views:
    - requests__mine
    - requests__renewals
    - subscriptions__renewing
    - subscriptions__spare_seats
    - subscriptions__calendar
  roles:
    - employee
    - requester
    - security_reviewer
    - finance_reviewer
    - subscription_owner
    - admin
  processes:
    - request_lifecycle
    - subscription_lifecycle
    - renewal_review_lifecycle
  commands:
    - submit_request
    - start_security_review
    - approve_security
    - reject_security
    - approve_finance
    - reject_finance
    - reopen_request
    - start_renewal_review
    - renew
    - give_notice
    - cancel_subscription
    - expire
    - decide_renewal
  workflows:
    - register_on_purchase_completed
    - renewal_warning
    - dpa_missing_digest
    - stamp_seat_date
