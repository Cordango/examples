lifecycle: request_lifecycle
entity: vendor_request
stateField: status
initial: draft
states:
  draft:
    label: Draft
    phase: not_started
  submitted:
    label: Submitted
    phase: not_started
  security_review:
    label: Security review
    phase: active
  finance_review:
    label: Finance review
    phase: active
  approved:
    label: Approved
    phase: done
  rejected:
    label: Rejected
    phase: cancelled
transitions:
  submit_request:
    label: Submit request
    from:
      - draft
    to: submitted
    requiredFields:
      - product_name
      - requester
      - business_purpose
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Request submitted for review.
      effects:
        - type: updateRecord
          set:
            submitted_at: '{{now}}'
        - type: notify
          to: '{{record.requester}}'
          title: 'Vendor request received: {{record.product_name}}'
          message: Security looks at it first, then Finance. You will hear from both.
          link: auto
      emits:
        - vendor.requested
  start_security_review:
    label: Start security review
    from:
      - submitted
    to: security_review
    action:
      placements:
        - recordHeader
        - tableRow
      effects: []
  approve_security:
    label: Pass security review
    from:
      - security_review
    to: finance_review
    requiredFields:
      - data_classification
      - security_risk
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Security review passed and sent to Finance.
      input:
        fields:
          - data_classification
          - personal_data
          - sso_available
          - dpa_required
          - security_risk
          - security_notes
        required:
          - data_classification
          - security_risk
      effects:
        - type: updateRecord
          set:
            security_reviewed_at: '{{now}}'
      emits:
        - vendor.security_cleared
  reject_security:
    label: Reject on security
    from:
      - security_review
    to: rejected
    action:
      style: danger
      placements:
        - recordHeader
      confirm:
        title: Reject this vendor request?
        message: The requester can reopen it after addressing the findings.
        confirmLabel: Reject
        tone: danger
      input:
        fields:
          - security_risk
          - security_notes
        required:
          - security_notes
      effects:
        - type: updateRecord
          set:
            security_reviewed_at: '{{now}}'
            decided_at: '{{now}}'
        - type: notify
          to: '{{record.requester}}'
          title: 'Vendor request rejected: {{record.product_name}}'
          message: Security did not clear it. The findings are on the request; address them and reopen it.
          link: auto
  approve_finance:
    label: Approve vendor
    from:
      - finance_review
    to: approved
    requiredFields:
      - annual_cost
      - contract_owner
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Vendor approved. The contract is on the register.
      confirm:
        title: Approve this vendor?
        message: This records the vendor as approved and opens a subscription for it.
        confirmLabel: Approve
      input:
        fields:
          - contract_owner
          - finance_notes
        required:
          - contract_owner
      effects:
        - type: updateRecord
          set:
            decided_at: '{{now}}'
        - type: notify
          to: '{{record.requester}}'
          title: 'Vendor approved: {{record.product_name}}'
          message: It is on the register now, owned by {{record.contract_owner}}.
          link: auto
        - type: createRecord
          set:
            product_name: '{{record.product_name}}'
            vendor: '{{record.vendor}}'
            request: '{{record.id}}'
            owner: '{{record.contract_owner}}'
            department: '{{record.department}}'
            annual_cost: '{{record.annual_cost}}'
            renewal_on: '{{record.renewal_on}}'
            seats_licensed: '{{record.estimated_users}}'
          entity: subscription
      emits:
        - vendor.approved
  reject_finance:
    label: Reject on commercial grounds
    from:
      - finance_review
    to: rejected
    action:
      style: danger
      placements:
        - recordHeader
      confirm:
        title: Reject this vendor request?
        confirmLabel: Reject
        tone: danger
      input:
        fields:
          - finance_notes
        required:
          - finance_notes
      effects:
        - type: updateRecord
          set:
            decided_at: '{{now}}'
        - type: notify
          to: '{{record.requester}}'
          title: 'Vendor request rejected: {{record.product_name}}'
          message: Finance did not approve it. The reason is on the request.
          link: auto
  reopen_request:
    label: Reopen
    from:
      - rejected
    to: draft
    action:
      label: Reopen request
      placements:
        - recordHeader
      effects: []
