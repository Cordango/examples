screen: dashboard
label: Dashboard
subtitle: Spend against plan, and the adjustments waiting for a decision.
layout:
  - kind: tiles
    tiles:
      - label: Committed
        icon: file-sign
        color: warning
        caption: Open commitments
        source:
          entity: spend_entry
          aggregate:
            op: sum
            field: amount
          filters:
            - field: kind
              operator: eq
              value: commitment
            - field: status
              operator: eq
              value: open
      - label: Actual
        icon: cash-check
        color: primary
        caption: Invoiced and paid
        source:
          entity: spend_entry
          aggregate:
            op: sum
            field: amount
          filters:
            - field: status
              operator: in
              value:
                - invoiced
                - paid
      - label: Waiting
        icon: scale-balance
        color: info
        caption: Adjustments to decide
        source:
          entity: budget_adjustment
          aggregate:
            op: count
          filters:
            - field: status
              operator: eq
              value: proposed
  - kind: chart
    label: Spend by category
    chartType: bar
    source:
      entity: spend_entry
      aggregate:
        op: sum
        field: amount
        groupBy: category
  - kind: view
    view: lines__over_plan
subject: budget
