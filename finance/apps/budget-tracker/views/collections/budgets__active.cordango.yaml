view: budgets__active
label: Active budgets
entity: budget
filters:
  - field: status
    operator: eq
    value: active
sort:
  - field: name
    direction: asc
kind: table
settings:
  columns:
    - name
    - cost_centre
    - holder
    - adjusted_total
    - committed_total
    - actual_total
    - forecast_total
    - variance
