role: finance_approver
name: Finance approver
description: The second hop, the one that records what was actually bought, and the owner of the purchase forms everybody else asks with.
grants:
  purchase_request:
    read: true
    update: true
    commands:
      - finance_approve
      - finance_escalate
      - reject_request
      - mark_purchased
  request_item:
    read: true
  vendor_quote:
    read: true
  approval_note:
    create: true
    read: true
  purchase_form:
    create: true
    read: true
    update: true
    delete: true
  purchase_question:
    create: true
    read: true
    update: true
    delete: true
  purchase_submission:
    read: true
    delete: true
  purchase_answer:
    read: true
