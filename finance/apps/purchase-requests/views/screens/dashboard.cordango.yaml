screen: dashboard
label: Dashboard
subtitle: Requests waiting for a decision and what has been bought.
layout:
  - kind: tiles
    tiles:
      - label: Waiting
        icon: clock-outline
        color: warning
        caption: Not decided yet
        source:
          entity: purchase_request
          aggregate:
            op: count
          filters:
            - field: status
              operator: in
              value:
                - requested
                - finance_review
                - management_review
      - label: Approved
        icon: check-decagram-outline
        color: success
        caption: Approved, not yet bought
        source:
          entity: purchase_request
          aggregate:
            op: sum
            field: amount
          filters:
            - field: status
              operator: eq
              value: approved
      - label: Bought
        icon: cart-check
        color: primary
        caption: Purchased so far
        source:
          entity: purchase_request
          aggregate:
            op: sum
            field: actual_amount
          filters:
            - field: status
              operator: eq
              value: purchased
  - kind: chart
    label: Requested by category
    chartType: bar
    source:
      entity: purchase_request
      aggregate:
        op: sum
        field: amount
        groupBy: category
  - kind: view
    view: requests__awaiting_manager
subject: purchase_request
