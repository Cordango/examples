screen: insights
label: Insights
subtitle: How heavily each room is booked, and where the week's demand falls.
icon: chart-bar
layout:
  - kind: stack
    gap: md
    blocks:
      - kind: tiles
        tiles:
          - label: Total bookings
            icon: calendar-clock
            color: primary
            caption: All time
            source:
              entity: booking
              aggregate:
                op: count
          - label: Rooms
            icon: door
            color: info
            caption: Rooms you can book
            source:
              entity: room
              aggregate:
                op: count
          - label: Awaiting decision
            icon: clock-outline
            color: warning
            caption: Requests to approve
            source:
              entity: booking
              filters:
                - field: status
                  operator: eq
                  value: pending
              aggregate:
                op: count
      - kind: columns
        columns:
          - - kind: chart
              chartType: bar
              label: Load by room (bookings)
              source:
                entity: booking
                aggregate:
                  op: count
                  groupBy: room
          - - kind: chart
              chartType: bar
              label: Load by day
              source:
                entity: booking
                aggregate:
                  op: count
                  groupBy: date
subject: booking
