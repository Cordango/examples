screen: overview
label: Overview
subtitle: Claims waiting for a decision and money still to pay back.
icon: view-dashboard
layout:
  - kind: stack
    gap: md
    blocks:
      - kind: tiles
        tiles:
          - label: Awaiting approval
            icon: clock-outline
            color: warning
            caption: Submitted, not decided
            source:
              entity: expense_claim
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: submitted
            link:
              page: claims
              filters:
                - field: status
                  operator: eq
                  value: submitted
          - label: To reimburse
            icon: cash-clock
            color: info
            caption: Approved, not paid yet
            format: money
            source:
              entity: expense_claim
              aggregate:
                op: sum
                field: amount
              filters:
                - field: status
                  operator: eq
                  value: approved
            link:
              page: claims
              filters:
                - field: status
                  operator: eq
                  value: approved
          - label: Reimbursed
            icon: cash-check
            color: success
            caption: Paid back so far
            format: money
            source:
              entity: expense_claim
              aggregate:
                op: sum
                field: amount
              filters:
                - field: status
                  operator: eq
                  value: reimbursed
            link:
              page: claims
              filters:
                - field: status
                  operator: eq
                  value: reimbursed
          - label: Declined
            icon: close-circle-outline
            color: error
            caption: All time
            source:
              entity: expense_claim
              aggregate:
                op: count
              filters:
                - field: status
                  operator: eq
                  value: declined
            link:
              page: claims
              filters:
                - field: status
                  operator: eq
                  value: declined
      - kind: columns
        columns:
          - - kind: chart
              chartType: donut
              label: Spend by category
              source:
                entity: expense_claim
                aggregate:
                  op: sum
                  field: amount
                  groupBy: category
              link:
                page: claims
          - - kind: chart
              chartType: bar
              label: Claims by month
              source:
                entity: expense_claim
                aggregate:
                  op: sum
                  field: amount
                  groupBy: month_of:spent_on
              link:
                page: claims
      - kind: section
        label: Approval inbox
        blocks:
          - kind: view
            view: inbox_table
subject: expense_claim
