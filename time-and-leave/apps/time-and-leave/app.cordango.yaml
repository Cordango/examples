app: time_and_leave
name: Zeiterfassung und Abwesenheiten
version: 1.7.0
description: Gesetzeskonforme Arbeitszeiterfassung nach dem Arbeitszeitgesetz und dem Mindestlohngesetz, erweitert um Urlaub, Krankheit und weitere Abwesenheiten, Sollzeit je Wochentag und ein Arbeitszeitkonto. Stempeluhr und Nacherfassung, Höchstarbeitszeit, Ruhepausen, Ruhezeit, Nacht-, Sonn- und Feiertagsarbeit, Ausgleichszeitraum, Aufzeichnungs- und Aufbewahrungspflichten.
schemaVersion: '2.0'
presentation:
  icon: clock-check-outline
  color: '#0f766e'
  category: Personal
  tagline: Arbeitszeit, Abwesenheit und Zeitkonto in einem Nachweis
archetype:
  kind: tracker
  coreJob: Arbeitszeiten und Abwesenheiten lückenlos erfassen, die Grenzen des Arbeitszeitgesetzes nachweisbar einhalten und den Saldo gegen die Sollzeit führen.
theme:
  primaryColor: '#0f766e'
  secondaryColor: '#f59e0b'
  font: Inter
  radius: small
  density: compact
