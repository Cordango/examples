entity: cost_line
label: Cost Line
description: 'A non-payroll cost: fixed monthly, scaling per user, or a one-off payment such as a German government fee.'
icon: cash-multiple
kind: collection
plural: Cost Lines
display: name
fields:
  name:
    label: Cost Line
    type: text
    required: true
  scenario:
    label: Scenario
    type: reference
    required: true
    indexed: true
    targetEntity: scenario
    onDelete: cascade
  cost_category:
    label: Category
    type: reference
    indexed: true
    targetEntity: cost_category
  cost_behaviour:
    label: Behaviour
    type: select
    required: true
    default: fixed_monthly
    options:
      - value: fixed_monthly
        label: Fixed monthly
        color: '#0f766e'
      - value: per_user
        label: Per user per month
        color: '#38bdf8'
      - value: one_off
        label: One-off payment
        color: '#f59e0b'
      - value: percent_of_revenue
        label: '% of a base'
        color: '#a16207'
  monthly_amount:
    label: Fixed Amount / Month
    type: money
    help: Used when behaviour is Fixed monthly.
    group: Amounts
    currency: EUR
  amount_per_user:
    label: Amount per User / Month
    type: money
    help: Used when behaviour is Per user.
    group: Amounts
    currency: EUR
  one_off_amount:
    label: One-off Amount
    type: money
    help: Used when behaviour is One-off.
    group: Amounts
    currency: EUR
  one_off_date:
    label: One-off Date
    type: date
    group: Amounts
  start_month:
    label: Starts
    type: date
    group: Timing
    role: start
  end_month:
    label: Ends
    type: date
    group: Timing
  annual_increase_rate:
    label: Annual Increase
    type: decimal
    group: Timing
    default: 0
    precision: 6
    scale: 2
    unit: '%'
  is_government_fee:
    label: Government / Statutory Fee
    type: boolean
    help: Trade register, IHK, notary, Finanzamt, GmbH filing and similar German statutory costs.
    group: Timing
    default: false
  vendor:
    label: Vendor / Authority
    type: text
    group: Timing
  notes:
    label: Notes
    type: longtext
    group: Timing
  percent_amount:
    label: Percent of Revenue
    type: decimal
    help: Used when behaviour is % of revenue — payment and collection fees, revenue share, affiliate commission.
    group: Amounts
    precision: 8
    scale: 3
    unit: '%'
  percent_basis:
    label: Percentage Of
    type: select
    help: Which figure the percentage applies to. Both are always positive, so the fee can never come out as a credit.
    group: Amounts
    default: revenue
    options:
      - value: revenue
        label: Revenue
        color: '#0f766e'
      - value: payroll
        label: Gross payroll
        color: '#6366f1'
  one_off_month:
    label: One-off Month
    type: integer
    help: Month of the plan this is paid, counting from month 1. Use this OR the exact date, whichever you actually know.
    group: Amounts
