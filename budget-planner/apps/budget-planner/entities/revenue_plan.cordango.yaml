entity: revenue_plan
label: Plan
description: 'One row of the published price list: a base fee, a rate per active user x app, and the cap factor k. Nothing here says who buys it — a customer lands on whichever plan is cheapest for their shape, so the plan is an outcome.'
icon: tag-multiple
kind: collection
plural: Plans
display: name
fields:
  name:
    label: Plan Name
    type: text
    required: true
  scenario:
    label: Scenario
    type: reference
    required: true
    indexed: true
    targetEntity: scenario
    onDelete: cascade
  tier:
    label: Tier
    type: select
    required: true
    options:
      - value: flex
        label: Flex / Free
        color: '#94a3b8'
      - value: starter
        label: Starter
        color: '#38bdf8'
      - value: pro
        label: Pro
        color: '#0f766e'
      - value: advanced
        label: Advanced
        color: '#6366f1'
      - value: enterprise
        label: Enterprise
        color: '#f59e0b'
  monthly_base_fee:
    label: Base fee / month
    type: money
    help: Charged whatever the usage is. Zero on Flex.
    group: Price
    default: 0
    currency: EUR
  price_per_app_user:
    label: Rate / active user x app
    type: money
    help: One unit is one person actively using one shared app this month.
    group: Price
    currency: EUR
  cap_multiplier:
    label: Cap factor k
    type: decimal
    help: Billable users for ONE app stop at k x the square root of the customer's active users. Blank on Flex (no cap) and on Enterprise (negotiated).
    group: Price
    precision: 16
    scale: 4
  notes:
    label: Notes
    type: longtext
    group: Unit Economics
