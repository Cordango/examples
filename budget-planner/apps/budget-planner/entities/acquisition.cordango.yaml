entity: acquisition
label: Acquisition
description: New customers won in one month, in one segment. This is the one table in the revenue model somebody types into.
icon: account-plus-outline
kind: collection
plural: Acquisition
display: label
fields:
  label:
    label: Month
    type: text
    required: true
  scenario:
    label: Scenario
    type: reference
    required: true
    indexed: true
    targetEntity: scenario
    onDelete: cascade
  segment:
    label: Segment
    type: reference
    required: true
    indexed: true
    targetEntity: segment
    onDelete: cascade
  month:
    label: Plan month
    type: integer
    required: true
    help: Counted from the plan start. Month 1 is the first month.
  new_customers:
    label: New customers
    type: integer
    help: Typed. Everything downstream of it is derived.
    default: 0
  services_revenue:
    label: Setup & services
    type: money
    help: Invoiced once, in the month the customers are won.
    group: Calculated
    currency: EUR
    computed:
      expr: new_customers * segment.setup_fee
