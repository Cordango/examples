automation: generate_periods
name: Lay out the plan's months
effects:
  - type: createForEach
    set:
      label: Month {{source.index}}
      scenario: '{{record.id}}'
      sequence: '{{source.index}}'
      start_date: '{{source.date}}'
      period_type: month
      end_date: '{{source.end}}'
    entity: period
    source:
      range:
        from: '{{record.plan_start}}'
        count: '{{record.plan_months}}'
        step: month
    key:
      - scenario
      - sequence
trigger: record.created
entity: scenario
