    set:
      name: GmbH formation & legal
      scenario: '{{record.id}}'
      cost_behaviour: one_off
      is_government_fee: true
      vendor: Notary / Handelsregister
      notes: Formation, contracts, trademark and setup.
      one_off_amount: 5000
      one_off_month: 1
    entity: cost_line
  - type: createRecord
