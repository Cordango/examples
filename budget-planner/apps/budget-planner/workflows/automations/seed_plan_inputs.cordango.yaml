    set:
      name: Payment & collection fees
      scenario: '{{record.id}}'
      cost_behaviour: percent_of_revenue
      percent_amount: 1.5
    entity: cost_line
  - type: createRecord
    set:
      name: IHK contribution
      scenario: '{{record.id}}'
      cost_behaviour: fixed_monthly
      is_government_fee: true
      vendor: IHK Mittleres Ruhrgebiet
      notes: €180/year base band up to €30,700 trade income (Wirtschaftssatzung 2026). The bands step up to €900; raise this as the plan grows. The additional 0.25% levy applies to positive trade income only, so it is nil while the plan is loss-making.
      monthly_amount: 15
    entity: cost_line
  - type: createRecord
    set:
      name: Berufsgenossenschaft
      scenario: '{{record.id}}'
      cost_behaviour: percent_of_revenue
      is_government_fee: true
      vendor: Berufsgenossenschaft
      notes: Planning rate of 1% of gross payroll. The real contribution depends on payroll, risk class and the tariff — confirm with the BG once registered.
      percent_amount: 1.0
      percent_basis: payroll
    entity: cost_line
  - type: createRecord
    set:
      name: Transparency register
      scenario: '{{record.id}}'
      cost_behaviour: fixed_monthly
      is_government_fee: true
      vendor: Bundesanzeiger
      notes: €19.80 a year under TrGebV, from fee year 2024.
      monthly_amount: 1.65
    entity: cost_line
  - type: createRecord
    set:
      name: Annual accounts & register filing
      scenario: '{{record.id}}'
      cost_behaviour: fixed_monthly
      is_government_fee: true
      vendor: Tax adviser
      notes: €300/year planning reserve. Validate with your adviser or filing provider.
      monthly_amount: 25
    entity: cost_line
  - type: createRecord
    set:
      name: Other mandatory fees
      scenario: '{{record.id}}'
      cost_behaviour: fixed_monthly
      is_government_fee: true
