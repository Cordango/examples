automation: warn_low_runway
name: Warn when runway drops low
when:
  all:
    - field: runway_months
      operator: lt
      value: 6
    - field: runway_months
      operator: isNotEmpty
effects:
  - type: notify
    to: '{{record.owner}}'
    title: Runway below 6 months on {{record.name}}
    message: The scenario {{record.name}} now shows {{record.runway_months}} months of runway. Review hiring and cost lines or bring funding forward.
    link: auto
trigger: field.changed
entity: scenario
field: runway_months
