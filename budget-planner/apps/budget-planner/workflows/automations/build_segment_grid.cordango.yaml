automation: build_segment_grid
name: Lay out a segment's lifecycle
effects:
  - type: createForEach
    set:
      scenario: '{{record.scenario}}'
      segment: '{{record.id}}'
      point: '{{source.id}}'
      label: '{{record.name}} {{source.label}}'
      flex:
        pick:
          entity: revenue_plan
          filters:
            - field: scenario
              operator: eq
              value: '{{record.scenario}}'
            - field: tier
              operator: eq
              value: flex
          sort:
            - field: name
              direction: asc
      starter:
        pick:
          entity: revenue_plan
          filters:
            - field: scenario
              operator: eq
              value: '{{record.scenario}}'
            - field: tier
              operator: eq
              value: starter
          sort:
            - field: name
              direction: asc
      pro:
        pick:
          entity: revenue_plan
          filters:
            - field: scenario
              operator: eq
              value: '{{record.scenario}}'
            - field: tier
              operator: eq
              value: pro
          sort:
            - field: name
              direction: asc
      advanced:
        pick:
          entity: revenue_plan
          filters:
            - field: scenario
              operator: eq
              value: '{{record.scenario}}'
            - field: tier
              operator: eq
              value: advanced
          sort:
            - field: name
              direction: asc
    entity: lifecycle_step
    source:
      entity: adoption_point
      filters:
        - field: scenario
          operator: eq
          value: '{{record.scenario}}'
    key:
      - segment
      - point
trigger: record.created
entity: segment
