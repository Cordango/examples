lifecycle: request_lifecycle
entity: vendor_request
stateField: status
initial: draft
states:
  draft:
    label: Draft
    phase: not_started
  submitted:
    label: Submitted
    phase: not_started
  security_review:
    label: Security review
    phase: active
  finance_review:
    label: Finance review
    phase: active
  approved:
    label: Approved
    phase: done
  rejected:
    label: Rejected
    phase: cancelled
transitions:
  submit_request:
    label: Submit request
    from:
      - draft
    to: submitted
    requiredFields:
      - product_name
      - requester
      - business_purpose
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Request submitted for review.
      effects:
        - type: updateRecord
          set:
            submitted_at: '{{now}}'
  start_security_review:
    label: Start security review
    from:
      - submitted
    to: security_review
    action:
      placements:
        - recordHeader
        - tableRow
      effects: []
  approve_security:
    label: Pass security review
    from:
      - security_review
    to: finance_review
    requiredFields:
      - data_classification
      - security_risk
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Security review passed and sent to Finance.
      effects:
        - type: updateRecord
          set:
            security_reviewed_at: '{{now}}'
  reject_security:
    label: Reject on security
    from:
      - security_review
    to: rejected
    action:
      style: danger
      placements:
        - recordHeader
      confirm:
        title: Reject this vendor request?
        message: The requester can reopen it after addressing the findings.
        confirmLabel: Reject
        tone: danger
      effects:
        - type: updateRecord
          set:
            security_reviewed_at: '{{now}}'
            decided_at: '{{now}}'
  approve_finance:
    label: Approve vendor
    from:
      - finance_review
    to: approved
    requiredFields:
      - annual_cost
      - contract_owner
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Vendor approved.
      confirm:
        title: Approve this vendor?
        message: This records the vendor as approved for use.
        confirmLabel: Approve
      effects:
        - type: updateRecord
          set:
            decided_at: '{{now}}'
  reject_finance:
    label: Reject on commercial grounds
    from:
      - finance_review
    to: rejected
    action:
      style: danger
      placements:
        - recordHeader
      confirm:
        title: Reject this vendor request?
        confirmLabel: Reject
        tone: danger
      effects:
        - type: updateRecord
          set:
            decided_at: '{{now}}'
  reopen_request:
    label: Reopen
    from:
      - rejected
    to: draft
    action:
      label: Reopen request
      placements:
        - recordHeader
      effects: []
