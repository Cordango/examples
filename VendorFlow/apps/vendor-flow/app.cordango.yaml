app: vendor_flow
name: VendorFlow
version: 0.1.0
description: Internal vendor intake, security review, approval, spend and renewal tracking.
presentation:
  icon: mdi-shield-check-outline
  color: '#475569'
  category: Operations
  tagline: Approve SaaS without losing the paper trail.
order:
  entities:
    - vendor_request
    - review_check
  pages:
    - dashboard
    - requests
    - renewals
  views:
    - requests__renewals
  roles:
    - requester
    - security_reviewer
    - finance_reviewer
    - admin
  processes:
    - request_lifecycle
  commands:
    - submit_request
    - start_security_review
    - approve_security
    - reject_security
    - approve_finance
    - reject_finance
    - reopen_request
  workflows: []
