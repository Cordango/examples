lifecycle: assignment_lifecycle
entity: assignment
stateField: status
initial: open
states:
  open:
    label: Open
    color: '#0f766e'
    phase: active
  closed:
    label: Closed
    color: '#64748b'
    terminal: true
    phase: done
transitions:
  close_assignment:
    label: Record the return
    from:
      - open
    to: closed
    action:
      style: primary
      placements:
        - recordHeader
        - tableRow
      input:
        fields:
          - returned_on
          - condition_in
          - notes
      effects:
        - type: updateRecord
          set:
            returned_on: '{{today}}'
          setIfEmpty: true
