automation: replacement_due
name: Warn before something is due for replacement
trigger: schedule
cron: 0 8 * * 1
entity: asset
when:
  all:
    - field: status
      operator: neq
      value: retired
    - field: replacement_due
      operator: lte
      value: '{{today+90}}'
effects:
  - type: notify
    to: '{{record.custodian}}'
    title: 'Due for replacement: {{record.asset_tag}}'
    message: Replace by {{record.replacement_due}}. It has cost {{record.total_cost}} so far.
    link: auto
