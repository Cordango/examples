automation: register_on_purchase_completed
name: Put hardware on the register when it is bought
when:
  field: category
  operator: in
  value:
    - hardware
    - equipment
effects:
  - type: createRecord
    set:
      asset_tag: PO-{{record.po_number}}
      category: other
      purchase_cost: '{{record.actual_amount}}'
      purchase_date: '{{record.purchased_on}}'
      supplier: '{{record.vendor}}'
      purchase_ref: '{{record.id}}'
      department: '{{record.department}}'
      custodian: '{{record.requester}}'
    entity: asset
trigger: command.emitted
event: purchase.completed
app: purchase_requests
