automation: reminder_before_due
name: Remind a week before the deadline
trigger: schedule
cron: 0 9 * * *
entity: feedback_request
when:
  all:
    - field: status
      operator: in
      value:
        - pending
        - in_progress
    - field: due_on
      operator: eq
      value: '{{today+7}}'
effects:
  - type: notify
    to: '{{record.reviewer}}'
    title: Feedback due in a week
    message: Still waiting on your answers.
    link: auto
