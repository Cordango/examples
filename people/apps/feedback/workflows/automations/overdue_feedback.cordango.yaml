automation: overdue_feedback
name: Chase feedback that is late
when:
  all:
    - field: status
      operator: in
      value:
        - pending
        - in_progress
    - field: due_on
      operator: lt
      value: '{{today}}'
effects:
  - type: notify
    to: '{{record.reviewer}}'
    title: Feedback overdue
    message: The deadline was {{record.due_on}}.
    link: auto
trigger: schedule
entity: feedback_request
cron: 0 9 * * *
