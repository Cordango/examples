lifecycle: feedback_lifecycle
entity: feedback_request
stateField: status
initial: pending
states:
  pending:
    label: Not started
    color: '#94a3b8'
    phase: not_started
  in_progress:
    label: In progress
    color: '#f59e0b'
    phase: active
  submitted:
    label: Submitted
    color: '#0f766e'
    terminal: true
    phase: done
  declined:
    label: Declined
    color: '#64748b'
    terminal: true
    phase: cancelled
transitions:
  start_feedback:
    label: Start
    from:
      - pending
    to: in_progress
    when:
      field: reviewer
      operator: eq
      value: '{{actor.id}}'
    action:
      style: primary
      placements:
        - recordHeader
        - tableRow
      effects: []
  submit_feedback:
    label: Submit
    from:
      - pending
      - in_progress
    to: submitted
    when:
      all:
        - field: reviewer
          operator: eq
          value: '{{actor.id}}'
        - field: scores_count
          operator: gte
          value: 1
    action:
      style: primary
      placements:
        - recordHeader
      successMessage: Submitted. Thank you.
      confirm:
        title: Submit this feedback?
        message: It cannot be edited afterwards, and the person will only ever see the scores as part of an average.
        confirmLabel: Submit
      effects:
        - type: updateRecord
          set:
            submitted_at: '{{now}}'
      emits:
        - feedback.submitted
  decline_feedback:
    label: Decline
    from:
      - pending
      - in_progress
    to: declined
    when:
      field: reviewer
      operator: eq
      value: '{{actor.id}}'
    action:
      placements:
        - recordHeader
      effects: []
