role: employee
name: Employee
description: Nominates their own peers, answers the requests addressed to them, and reads their own participant record. Deliberately has NO read on a feedback request or a score, which is what makes peer anonymity a property of the data rather than a promise in a label.
grants:
  review_cycle:
    read: true
  participant:
    read: true
  nomination:
    create: true
    read: true
  feedback_request:
    update: true
    commands:
      - start_feedback
      - submit_feedback
      - decline_feedback
  feedback_score:
    create: true
    update: true
  competency:
    read: true
