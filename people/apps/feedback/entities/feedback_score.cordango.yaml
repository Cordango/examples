entity: feedback_score
label: Score
description: One competency, scored once, by one reviewer. A row per competency rather than a single overall number, so a person can be strong at one thing and weak at another instead of being reduced to an average.
icon: mdi-numeric
plural: Scores
display: comment
ownedBy:
  parent: feedback_request
  via: request
  as: table
fields:
  request:
    label: Request
    type: reference
    required: true
    indexed: true
    targetEntity: feedback_request
    onDelete: cascade
  competency:
    label: Competency
    type: reference
    required: true
    targetEntity: competency
  score:
    label: Score
    type: integer
    required: true
    help: One to five.
  comment:
    label: Comment
    type: text
