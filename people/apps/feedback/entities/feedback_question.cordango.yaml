entity: feedback_question
label: Question
description: One question on one questionnaire. Scale questions give a number HR can chart across everyone who answered; text questions give the words a summary is written from.
icon: mdi-help-circle-outline
role: formField
ownedBy:
  parent: feedback_form
  via: form
  as: table
plural: Questions
display: text
fields:
  form:
    label: Questionnaire
    type: reference
    required: true
    targetEntity: feedback_form
    onDelete: cascade
  text:
    label: Question
    type: text
    required: true
  answer_type:
    label: Answer type
    type: select
    role: answerType
    options:
      - value: scale
        label: Scale of 1 to 5
      - value: long_text
        label: Long text
      - value: short_text
        label: Short text
      - value: single_choice
        label: One of several
      - value: multi_choice
        label: Several of several
      - value: yes_no
        label: Yes or no
  choices:
    label: Choices
    type: json
    help: The options a choice question offers. Empty for every other kind.
    role: answerOptions
  required:
    label: Must be answered
    type: boolean
    role: answerRequired
  position:
    label: Position
    type: integer
    role: order
