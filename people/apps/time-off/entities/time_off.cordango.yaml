entity: time_off
label: Time off
description: "One absence, from the day it is asked for to the day it is taken. The person asking fills in four things — what kind, from when, until when, and a word for the approver. Everything else is worked out or decided by somebody else. It carries `calendar: true`, so an approved holiday appears in the person's own calendar beside their meetings and their project milestones without any app being told about the others."
icon: beach
calendar: true
plural: Time off
display: type
fields:
  requested_by:
    label: For
    type: reference
    help: Who is taking the time off. Opens as you; HR can change it to file a sick note that arrived by phone.
    targetEntity: person
    targetApp: platform
    onDelete: setNull
  type:
    label: Type
    type: select
    required: true
    default: vacation
    options:
      - value: vacation
        label: Vacation
        color: '#0ea5e9'
      - value: sick
        label: Sick
        color: '#ef4444'
      - value: personal
        label: Personal
        color: '#a855f7'
      - value: unpaid
        label: Unpaid
        color: '#64748b'
      - value: other
        label: Other
        color: '#94a3b8'
  start_date:
    label: From
    type: date
    required: true
    indexed: true
    role: start
  end_date:
    label: To
    type: date
    required: true
    role: due
  half_day:
    label: Half day
    type: boolean
  reason:
    label: Reason
    type: text
    help: Optional note for the approver.
  department:
    label: Department
    type: reference
    help: Taken from the person's allowance record when the request is made, so the team calendar can be filtered without asking.
    targetEntity: department
    targetApp: platform
  allowance:
    label: Allowance year
    type: reference
    help: The allowance this request draws on. Stamped from the entitlement of the same kind whose leave year covers the start date, so a request filed late still counts against the year it was taken in. Never picked by hand — it is what the balance is summed from.
    targetEntity: leave_allowance
    onDelete: setNull
  approver:
    label: Approver
    type: reference
    help: Who decides. Taken from the person's allowance record when the request is made; HR can change it when somebody else should decide.
    targetEntity: person
    targetApp: platform
  decided_by:
    label: Decided by
    type: reference
    help: Who actually approved or declined it. Stamped by the decision, never typed.
    group: Decision
    targetEntity: person
    targetApp: platform
  day_count:
    label: Days
    type: integer
    help: 'Calendar days, inclusive of both ends. Not working days: there is no weekday-aware count in an expression, and a number that quietly excluded weekends in one country and not another would be worse than an honest one.'
    computed:
      expr: days_between(start_date, end_date) + 1
  deducts_allowance:
    label: Counts against the allowance
    type: boolean
    help: Holiday does, sickness does not. Decided when the request is made from the type, so changing the policy later does not silently rewrite last year's balances. Never asked for.
    initial:
      - when:
          field: type
          operator: in
          value:
            - vacation
            - personal
        value: true
      - when:
          field: type
          operator: in
          value:
            - sick
            - unpaid
            - other
        value: false
  submitted_at:
    label: Submitted
    type: datetime
    group: Decision
  decided_at:
    label: Decided
    type: datetime
    group: Decision
  cancel_reason:
    label: Cancelled because
    type: text
    group: Decision
  status:
    label: Status
    type: select
    indexed: true
    role: status
  decline_reason:
    label: Decline reason
    type: longtext
    group: Decision
