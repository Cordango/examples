entity: leave_question
label: Question
description: One question on one leave form, and which field of the request its answer fills. A question that fills nothing is still kept with the submission, where the approver can read it.
icon: mdi-help-circle-outline
role: formField
ownedBy:
  parent: leave_form
  via: form
  as: table
plural: Questions
display: text
fields:
  form:
    label: Form
    type: reference
    required: true
    targetEntity: leave_form
    onDelete: cascade
  text:
    label: Question
    type: text
    required: true
  answer_type:
    label: Answer type
    type: select
    role: answerType
    options:
      - value: short_text
        label: Short text
      - value: long_text
        label: Long text
      - value: single_choice
        label: One of several
      - value: multi_choice
        label: Several of several
      - value: yes_no
        label: Yes or no
      - value: number
        label: Number
      - value: date
        label: Date
      - value: scale
        label: Scale of 1 to 5
  choices:
    label: Choices
    type: json
    help: The options a choice question offers. Empty for every other kind.
    role: answerOptions
  required:
    label: Must be answered
    type: boolean
    help: Enforced on the server, so a request cannot arrive without the two dates it is made of.
    role: answerRequired
  fills:
    label: Fills
    type: text
    help: Which field of the request this answer lands in. The first and last day are the two a request cannot be made without.
    role: mapsTo
  position:
    label: Position
    type: integer
    role: order
