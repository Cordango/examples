screen: schedule
label: Who's off
subtitle: See who's out of office and plan your team's time ahead.
icon: calendar-month
state:
  - key: cursor
    type: date
    default: '{{today}}'
layout:
  - kind: timeline
    entity: time_off
    rowBy: requested_by
    startField: start_date
    endField: end_date
    axis:
      from: '{{state.cursor}}'
      range: month
    colorField: type
    labelField: type
    openDetail: true
subject: time_off
