automation: roll_allowances
name: Open next year's allowance when this one ends
trigger: schedule
cron: 0 6 * * *
entity: leave_allowance
when:
  all:
    - field: year_end
      operator: lt
      value: '{{today}}'
    - field: year_end
      operator: gte
      value: '{{today-7d}}'
effects:
  - type: createRecord
    entity: leave_allowance
    set:
      person: '{{record.person}}'
      employee: '{{record.employee}}'
      leave_type: '{{record.leave_type}}'
      year: '{{record.next_year}}'
      year_start: '{{today}}'
      year_end: '{{today+364}}'
      base_days: '{{record.base_days}}'
      carry_over_days: '{{record.carry_over_eligible}}'
