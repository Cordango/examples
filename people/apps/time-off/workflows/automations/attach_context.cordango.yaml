automation: attach_context
name: A request knows who decides it and which team it belongs to
effects:
  - type: updateRecord
    set:
      approver:
        pick:
          entity: leave_allowance
          filters:
            - field: person
              operator: eq
              value: '{{record.requested_by}}'
          sort:
            - field: year
              direction: desc
          field: manager
      department:
        pick:
          entity: leave_allowance
          filters:
            - field: person
              operator: eq
              value: '{{record.requested_by}}'
          sort:
            - field: year
              direction: desc
          field: department
    setIfEmpty: true
trigger: record.created
entity: time_off
