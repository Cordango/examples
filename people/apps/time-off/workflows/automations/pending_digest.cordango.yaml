automation: pending_digest
name: Monday list for approvers
when:
  field: status
  operator: eq
  value: pending
effects:
  - type: notify
    to: '{{record.approver}}'
    title: Time off still waiting
    message: '{{record.day_count}} days from {{record.start_date}}, asked for by {{record.requested_by}}.'
    link: auto
trigger: schedule
entity: time_off
cron: 0 8 * * 1
