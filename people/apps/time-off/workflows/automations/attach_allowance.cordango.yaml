automation: attach_allowance
name: Point a request at the allowance it comes off
trigger: record.created
entity: time_off
effects:
  - type: updateRecord
    setIfEmpty: true
    set:
      allowance:
        pick:
          entity: leave_allowance
          filters:
            - field: person
              operator: eq
              value: '{{record.requested_by}}'
          sort:
            - field: year
              direction: desc
          field: id
