automation: low_balance_warning
name: Tell somebody when their holiday is nearly gone
when:
  field: remaining_days
  operator: lt
  value: 3
effects:
  - type: notify
    to: '{{record.person}}'
    title: Not much holiday left
    message: '{{record.remaining_days}} days remaining this year, with {{record.pending_days}} already asked for.'
    link: auto
trigger: schedule
entity: leave_allowance
cron: 0 9 * * 1
