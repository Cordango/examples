role: employee
name: Employee
description: Asks for time off, on a leave form or in the New dialog, and can take it back. Reads the team's absences so a clash is visible before it is asked for.
grants:
  time_off:
    create: true
    read: true
    update: true
    commands:
      - submit_time_off
      - cancel_time_off
      - reopen_time_off
  leave_allowance:
    read: true
  blackout_period:
    read: true
  public_holiday:
    read: true
  leave_form:
    read: true
  leave_question:
    read: true
  leave_submission:
    create: true
    read: true
  leave_answer:
    read: true
