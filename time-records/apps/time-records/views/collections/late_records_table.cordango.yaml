view: late_records_table
label: Verspätet aufgezeichnet
entity: time_entry
filters:
  - field: milog_late
    operator: eq
    value: true
sort:
  - field: entry_date
    direction: desc
kind: table
settings:
  columns:
    - entry_date
    - worker
    - entry_label
    - recorded_at
    - capture_source
    - change_reason
  filterBar:
    facets:
      - worker
      - capture_source
  inlineEdit: false
